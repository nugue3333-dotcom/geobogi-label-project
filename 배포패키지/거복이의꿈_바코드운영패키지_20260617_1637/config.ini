[printer]
# Change only this brand value for the customer printer.
# Supported values: bixolon, tsc, zebra
brand = bixolon
mode = network
print_method = direct_thermal
language = auto
command_encoding = auto
ip = 192.168.0.50
port = 9100
windows_printer_name = auto

[brand.bixolon]
language = slcs
command_encoding = cp949
windows_printer_name = BIXOLON Label Printer

[brand.tsc]
language = tspl
command_encoding = utf-8
windows_printer_name = TSC Label Printer

[brand.zebra]
language = zpl
command_encoding = utf-8
windows_printer_name = ZDesigner Label Printer

[label]
width_mm = 50
height_mm = 40
dpi = 203
gap_mm = 3

[barcode]
# Supported values: code128, code39, ean13, ean8, upca, itf, qr, datamatrix, pdf417
type = code128
# yes = center barcode/text automatically for the label size. no = use x/y below.
auto_layout = yes
x = 110
y = 86
rotation = 0

[barcode.1d]
height = 62
narrow = 2
# auto = bixolon/slcs: 6, tsc/zebra: 2
wide = auto
human_readable = yes

[barcode.qr]
model = 2
ecc = M
cell_size = 4

[barcode.datamatrix]
cell_size = 4

[barcode.pdf417]
rows = 30
columns = 5
security_level = 2
module_width = 3
module_height = 10

[data]
excel_file = print_queue.xlsx
output_dir = out
