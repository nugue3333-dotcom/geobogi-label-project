[printer]
# Change only this brand value for the customer printer.
# Supported values: bixolon, tsc, zebra, sewoo
brand = bixolon
mode = network
print_method = direct_thermal
# Supported values: normal, rotate_180
# normal preserves the existing print direction. rotate_180 flips the whole label output.
# normal / landscape / rotate_180 / landscape_180
print_orientation = normal
# Supported values: tear_off, cutter, peeler
# peeler is supported for TSC/Zebra/SEWOO(ZPL). BIXOLON/SLCS supports tear_off or cutter until an official peeler command is confirmed.
media_handling = tear_off
language = auto
command_encoding = auto
ip = 192.168.0.50
port = 9100
windows_printer_name = auto

[brand.bixolon]
language = slcs
command_encoding = cp949
windows_printer_name = BIXOLON Label Printer

[brand.tsc]
language = tspl
command_encoding = utf-8
windows_printer_name = TSC Label Printer

[brand.zebra]
language = zpl
command_encoding = utf-8
windows_printer_name = ZDesigner Label Printer

[brand.sewoo]
language = zpl
command_encoding = utf-8
windows_printer_name = SEWOO Label Printer

[label]
width_mm = 50
height_mm = 40
dpi = 203
gap_mm = 3
# Supported values: gap, black_mark, continuous
media_type = gap
# Whole-page position after rotation: +right / +down in mm
offset_x_mm = 0
offset_y_mm = 0
# TSPL: gap sensor offset (0..label height); auto inherits sensor/media/gap setup.
# SLCS: sensor/perforation offset (+/-100 dots app range); auto omits SL p4.
# ZPL: no equivalent gap-offset command in this adapter; leave auto or legacy 0.
# Settings saves offsets_profile=brand to distinguish intentional BIXOLON zero
# from old disabled controls that saved zero but never sent it to the printer.
gap_offset_mm = 0
# auto omits feed OFFSET; explicit 0 resets it
# TSPL OFFSET +/-25.4mm; SLCS TA +/-100 dots (printer permanently stores TA).
# Zebra ~TA +/-120 steps; 600dpi uses two dots per step. SEWOO: auto only.
# auto sends no adjustment; 0 explicitly resets. Settings save writes only this file.
feed_offset_mm = auto

[barcode]
# Supported values: code128, code39, ean13, ean8, upca, itf, qr, datamatrix, pdf417
type = code128
# yes = center barcode/text automatically for the label size. no = use x/y below.
auto_layout = yes
x = 110
y = 86
rotation = 0

[barcode.1d]
height = 62
narrow = 2
# auto = bixolon/slcs: 6, tsc/zebra/sewoo: 2
wide = auto
human_readable = yes

[barcode.qr]
model = 2
ecc = M
cell_size = 4

[barcode.datamatrix]
cell_size = 4

[barcode.pdf417]
rows = 30
columns = 5
security_level = 2
module_width = 3
module_height = 10

[data]
excel_file = print_queue.xlsx
output_dir = out
