[printer]
brand = tsc
mode = windows_raw
print_method = direct_thermal
media_handling = tear_off
speed = 5
density = 10
language = auto
command_encoding = auto
ip = 192.168.0.130
port = 9100
windows_printer_name = TSC MH341

[brand.bixolon]
language = slcs
command_encoding = cp949
windows_printer_name = BIXOLON XD7-20d

[brand.tsc]
language = tspl
command_encoding = utf-8
windows_printer_name = TSC Label Printer

[brand.zebra]
language = zpl
command_encoding = utf-8
windows_printer_name = ZDesigner Label Printer

[label]
width_mm = 100
height_mm = 100
dpi = 300
gap_mm = 3
media_type = gap

[barcode]
type = code128
auto_layout = yes
x = 110
y = 86
rotation = 0

[barcode.1d]
height = 80
narrow = 2
wide = 2
human_readable = yes

[barcode.qr]
model = 2
ecc = M
cell_size = 4

[barcode.datamatrix]
cell_size = 4

[barcode.pdf417]
rows = 30
columns = 5
security_level = 2
module_width = 3
module_height = 10

[data]
excel_file = print_queue.xlsx
output_dir = out

